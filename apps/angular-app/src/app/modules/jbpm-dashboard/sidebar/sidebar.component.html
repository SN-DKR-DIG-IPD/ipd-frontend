<!-- custome  sidebar.component.html  -->


<aside
  [ngStyle]="{
    'background-color': activeTheme.sidebar.customColors.background || '#f9fafb'
  }"
  class="w-64 fixed h-screen shadow-lg"
>
  <!-- Logo -->
  <div
    [ngStyle]="{
      'background-color': activeTheme.sidebar.customColors.background || '#f9fafb'
    }"
    class="h-[60px] flex flex-col justify-center px-6 border-b"
  >
    <div
      [ngStyle]="{
        'color': activeTheme.sidebar.customColors.logoText || '#dc2626'
      }"
      class="text-xl font-bold"
    >
      Vodacom
    </div>
    <div
      [ngStyle]="{
        'color': activeTheme.sidebar.customColors.logoText || '#dc2626'
      }"
      class="text-sm font-bold"
    >
      Business Process Management
    </div>
  </div>

  <!-- Navigation -->
  <nav class="p-4 space-y-2">
    <button
      *ngFor="let item of navItems"
      (click)="setActiveNav(item)"
      class="flex items-center justify-between w-full px-4 py-2 text-left rounded-lg transition-colors"
      [ngStyle]="{
        'color': activeNav === item.id
          ? (activeTheme.sidebar.customColors.activeItemText || '#dc2626')
          : (activeTheme.sidebar.customColors.itemText || '#4b5563'),
        'background-color': activeNav === item.id
          ? (activeTheme.sidebar.customColors.activeItemBg || '#fee2e2')
          : 'transparent'
      }"
      [ngClass]="activeNav !== item.id ? activeTheme.sidebar.navItemHover : ''"
    >
      <div class="flex items-center gap-3">
        <span class="material-icons">{{ item.icon }}</span>
        <span>{{ item.label | translate }}</span>
      </div>
      <i
        *ngIf="item.id === 'Configuration'"
        class="fas fa-chevron-down transition-transform duration-200"
        [class.rotate-180]="isConfigOpen && activeNav === 'Configuration'"
      ></i>
    </button>

    <!-- Configuration Dropdown -->
    <div
      *ngIf="isConfigOpen && activeNav === 'Configuration'"
      class="ml-6 space-y-1"
    >
      <button
        *ngFor="let option of configOptions"
        class="w-full px-4 py-2 text-left rounded-lg transition-colors flex items-center gap-2"
        [ngStyle]="{
          'color': activeTheme.sidebar.customColors.itemText || '#4b5563'
        }"
        [ngClass]="activeTheme.sidebar.navItemHover"
      >
        <span class="material-icons text-sm">subdirectory_arrow_right</span>
        <span>{{ option | translate }}</span>
      </button>
    </div>
  </nav>
</aside>
