<div class="bg-white shadow-md rounded-lg p-6">
  <h2 class="text-xl font-semibold text-gray-800 mb-4">Mes tâches à traiter</h2>

  <div *ngIf="isLoading" class="flex justify-center items-center p-8">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
    <span class="ml-2">Chargement des tâches...</span>
  </div>

  <div *ngIf="errorMsg" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6">
    <strong>Erreur :</strong> {{ errorMsg }}
  </div>

  <div *ngIf="!isLoading && tasks.length > 0">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Titre</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Processus</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Statut</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let task of tasks" class="hover:bg-gray-50">
          <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-900">{{ task['task-name'] }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ task['process-name'] || 'N/A' }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ task['task-status'] }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm">
            <button (click)="openTask(task)" class="flex items-center gap-2 px-3 py-1 bg-blue-100 text-blue-800 rounded hover:bg-blue-200 transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              Ouvrir
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!isLoading && tasks.length === 0" class="text-center py-12">
    <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
    </svg>
    <h3 class="mt-2 text-sm font-medium text-gray-900">Aucune tâche à traiter</h3>
    <p class="mt-1 text-sm text-gray-500">Vous n'avez actuellement aucune tâche en attente.</p>
  </div>
</div>
