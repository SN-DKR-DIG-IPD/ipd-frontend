<div *ngIf="!closeModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-5xl max-h-[95vh] overflow-hidden border border-gray-200">
    <!-- Header avec gradient -->
    <div class="bg-gradient-to-r from-blue-600 to-blue-700 text-white px-6 py-4 rounded-t-xl">
      <div class="flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
            <span class="material-icons text-white text-lg">assignment</span>
          </div>
          <div>
            <h2 class="text-xl font-semibold">Formulaire de la tâche</h2>
            <p class="text-blue-100 text-sm">Remplissez les informations requises</p>
          </div>
        </div>
        <button 
          class="p-2 hover:bg-white/20 rounded-lg transition-all duration-200 group"
          (click)="onclose()"
          title="Fermer"
        >
          <span class="material-icons text-white group-hover:scale-110 transition-transform">close</span>
        </button>
      </div>
    </div>
    
    <!-- Contenu du formulaire -->
    <div class="p-6 overflow-auto max-h-[calc(95vh-80px)]">
      <!-- Formulaire jBPM avec style amélioré -->
      <div #modalForm id="modalForm" class="w-full space-y-6">
        <!-- Le contenu du formulaire sera injecté ici -->
      </div>
    </div>
    
    <!-- Footer avec actions -->
    <div class="bg-gray-50 px-6 py-4 border-t border-gray-200 rounded-b-xl">
      <div class="flex justify-between items-center">
        <div class="text-sm text-gray-600">
          <span class="material-icons text-gray-400 text-sm mr-1">info</span>
          Utilisez les boutons du formulaire pour valider vos actions
        </div>
        <div class="flex space-x-3">
          <button 
            class="px-4 py-2 text-gray-600 hover:text-gray-800 transition-colors"
            (click)="onclose()"
          >
            Annuler
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
