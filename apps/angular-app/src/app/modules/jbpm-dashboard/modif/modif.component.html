<app-modal #modal
[closeModal]="closeModal"
[scale]="scale"
(modalShowChange)="setCloseModal($event)"
(onScaleChanged)="setScale($event)"
(onMaximizedChanged)="setMaximized($event)"
>
  <!-- Modal Content -->
 <ng-container *ngIf="taskStatus === TaskStatus.Ready; else canValidateForm">
  <div class="bg-white rounded-lg"
         [ngClass]="{'fixed inset-4': isMaximized, 'w-full max-w-2xl': !isMaximized}"
         [style.transform]="'scale(' + scale + ')'"
         style="transform-origin: center; transition: transform 0.2s ease-in-out;">
      <div class="p-6">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
          <!-- <div>
            <div class=" text-gray-500 mb-1">TYPE:
              <span class="font-[#00005C]">{{'Test'}}</span> 
            </div>
          
            <h6 class="text-[14px]  text-[#0073E6]">testt</h6>
          </div> -->
          <button class="p-2 hover:bg-gray-100 rounded-full transition-colors">
            <span class="material-icons" (click)="modal.hideModal(); closeModal=true">close</span>
          </button>
        </div>
        <div #modalForm id="modalForm">
        
        </div>
      </div>
  </div>
 </ng-container>
  
</app-modal>
<ng-template #canValidateForm>
<div class="bg-white rounded-lg"
       [ngClass]="{'fixed inset-4': isMaximized, 'w-full max-w-2xl': !isMaximized}"
       [style.transform]="'scale(' + scale + ')'"
       style="transform-origin: center; transition: transform 0.2s ease-in-out;">
    <div class="p-6">
      <!-- Header -->
      <div class="flex justify-between items-center mb-6">
        <!-- <div>
          <div class=" text-gray-500 mb-1">TYPE:
            <span class="font-[#00005C]">{{'Test'}}</span> 
          </div>

          <h6 class="text-[14px]  text-[#0073E6]">testt</h6>
        </div> -->
        <button class="p-2 hover:bg-gray-100 rounded-full transition-colors">
          <span class="material-icons" (click)="modal.hideModal(); closeModal=true">close</span>
        </button>
      </div>
      <div #modalForm id="modalForm">

      </div>
    </div>
  </div>
</ng-template>
