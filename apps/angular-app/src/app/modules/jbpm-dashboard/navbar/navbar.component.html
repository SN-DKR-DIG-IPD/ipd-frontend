<header
  [ngStyle]="{
    'background-color': customColors.background,
    'color': customColors.text
  }"
  [ngClass]="[
    typographySettings.fontFamily,
    typographySettings.fontSize,
    typographySettings.fontWeight
  ]"
  class="flex justify-between border-b border-gray-200 px-4 py-2 h-[60px]"
>
  <div class="flex items-center gap-4">
    <button
      [ngStyle]="{
        'background-color': customColors.buttonBackground,
        'color': customColors.buttonText
      }"
      class="flex items-center gap-2 rounded-lg border transition-colors"
      [ngClass]="[
        activeTheme.buttonPadding,
        activeTheme.buttonBorder,
        activeTheme.buttonHover
      ]"
    >
      <i class="fas fa-user"></i>
    </button>

    <button
      (click)="toggleThemeModal()"
      [ngStyle]="{
        'background-color': customColors.buttonBackground,
        'color': customColors.buttonText
      }"
      class="flex items-center gap-2 rounded-lg border transition-colors"
      [ngClass]="[
        activeTheme.buttonPadding,
        activeTheme.buttonBorder,
        activeTheme.buttonHover
      ]"
    >
      <i class="fas fa-paintbrush"></i>
      <span>{{ 'THEME.Theme' | translate }}</span>
    </button>
  </div>

  <div class="flex justify-end items-center">
    <div class="flex items-center space-x-4">
      <button
        [ngStyle]="{
          'background-color': customColors.buttonBackground,
          'color': customColors.buttonText
        }"
        class="flex items-center gap-2 rounded-lg border transition-colors"
        [ngClass]="[
          activeTheme.buttonPadding,
          activeTheme.buttonBorder,
          activeTheme.buttonHover
        ]"
      >
        <span>{{ 'myAccount.Account' | translate }}</span>
        <i class="fas fa-chevron-down"></i>
      </button>

      <div class="relative">
        <button
          (click)="toggleLanguageMenu()"
          [ngStyle]="{
            'background-color': customColors.buttonBackground,
            'color': customColors.buttonText
          }"
          class="flex items-center gap-2 rounded-lg border transition-colors"
          [ngClass]="[
            activeTheme.buttonPadding,
            activeTheme.buttonBorder,
            activeTheme.buttonHover
          ]"
        >
          <i class="fas fa-globe"></i>
          <span class="uppercase">{{ selectedLanguage.code }}</span>
          <i class="fas fa-chevron-down"></i>
        </button>

        <!-- Dropdown Menu -->
        <div
          *ngIf="isLanguageMenuOpen"
          class="absolute top-full mt-1 right-0 bg-white rounded-lg shadow-lg py-2 min-w-[160px] z-10"
        >
          <button
            *ngFor="let lang of languages"
            class="w-full px-4 py-2 text-left text-gray-700 hover:bg-gray-100 flex justify-between items-center"
            (click)="selectLanguage(lang)"
            [class.bg-gray-100]="lang.code === selectedLanguage.code"
          >
            <span>{{ lang.label }}</span>
            <span class="text-gray-400 uppercase text-sm">{{ lang.code }}</span>
          </button>
        </div>
      </div>

      <div class="relative">
        <button
          [ngClass]="activeTheme.iconHover"
          class="transition-colors"
          [ngStyle]="{ color: customColors.text }"
        >
          <i class="fas fa-bell"></i>
        </button>
        <div class="absolute -top-0.5 -right-0.5 w-2 h-2 bg-red-500 rounded-full"></div>
      </div>

      <button
        (click)="logout()"
        [ngClass]="activeTheme.iconHover"
        class="transition-colors"
        [ngStyle]="{ color: customColors.text }"
      >
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </div>
</header>

<!-- Theme Modal -->
<div
  *ngIf="isThemeModalOpen"
  class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center"
>
  <div class="bg-white rounded-lg p-6 w-full max-w-2xl">
    <!-- Modal Header with Tabs -->
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xl font-semibold">{{ 'THEME.customize' | translate }}</h2>
      <div class="flex gap-2">
        <button
          (click)="setActiveTab('themes')"
          class="px-3 py-2 rounded-lg flex items-center gap-2"
          [ngClass]="activeTab === 'themes' ? 'bg-blue-50 text-blue-600' : 'text-gray-600'"
        >
          <i class="fas fa-palette"></i>
          <span>{{ 'THEME.presets' | translate }}</span>
        </button>
        <button
          (click)="setActiveTab('colors')"
          class="px-3 py-2 rounded-lg flex items-center gap-2"
          [ngClass]="activeTab === 'colors' ? 'bg-blue-50 text-blue-600' : 'text-gray-600'"
        >
          <i class="fas fa-fill-drip"></i>
          <span>{{ 'THEME.customColors' | translate }}</span>
        </button>
        <button
          (click)="setActiveTab('typography')"
          class="px-3 py-2 rounded-lg flex items-center gap-2"
          [ngClass]="activeTab === 'typography' ? 'bg-blue-50 text-blue-600' : 'text-gray-600'"
        >
          <i class="fas fa-font"></i>
          <span>{{ 'THEME.typography' | translate }}</span>
        </button>
        <button
          (click)="setActiveTab('sidebar')"
          class="px-3 py-2 rounded-lg flex items-center gap-2"
          [ngClass]="activeTab === 'sidebar' ? 'bg-blue-50 text-blue-600' : 'text-gray-600'"
        >
          <i class="fas fa-columns"></i>
          <span>{{ 'THEME.sidebar' | translate }}</span>
        </button>
      </div>
    </div>

    <!-- Tab Content -->
    <div [ngSwitch]="activeTab">
      <!-- Themes Tab -->
      <div *ngSwitchCase="'themes'" class="grid grid-cols-2 gap-4 py-4">
        <div
          *ngFor="let theme of themes"
          (click)="selectTheme(theme)"
          class="p-4 rounded-lg border cursor-pointer transition-all hover:border-blue-500"
          [ngClass]="{
            'ring-2 ring-blue-500': selectedTheme.id === theme.id
          }"
        >
          <div
            class="w-full h-8 rounded-md mb-2"
            [ngClass]="theme.preview"
          ></div>
          <div class="text-sm font-medium">{{ theme.name }}</div>
        </div>
      </div>

      <!-- Colors Tab -->
      <div *ngSwitchCase="'colors'" class="space-y-6">
        <!-- Background Color -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            {{ 'THEME.backgroundColor' | translate }}
          </label>
          <div class="flex items-center gap-4">
            <input
              type="color"
              [value]="customColors.background"
              (change)="updateCustomColor('background', $event)"
              class="w-12 h-12 rounded cursor-pointer"
            >
            <input
              type="text"
              [value]="customColors.background"
              (input)="updateCustomColor('background', $event)"
              class="px-3 py-2 border rounded-lg w-32"
            >
          </div>
        </div>

        <!-- Text Color -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            {{ 'THEME.textColor' | translate }}
          </label>
          <div class="flex items-center gap-4">
            <input
              type="color"
              [value]="customColors.text"
              (change)="updateCustomColor('text', $event)"
              class="w-12 h-12 rounded cursor-pointer"
            >
            <input
              type="text"
              [value]="customColors.text"
              (input)="updateCustomColor('text', $event)"
              class="px-3 py-2 border rounded-lg w-32"
            >
          </div>
        </div>

        <!-- Button Background -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            {{ 'THEME.buttonBackground' | translate }}
          </label>
          <div class="flex items-center gap-4">
            <input
              type="color"
              [value]="customColors.buttonBackground"
              (change)="updateCustomColor('buttonBackground', $event)"
              class="w-12 h-12 rounded cursor-pointer"
            >
            <input
              type="text"
              [value]="customColors.buttonBackground"
              (input)="updateCustomColor('buttonBackground', $event)"
              class="px-3 py-2 border rounded-lg w-32"
            >
          </div>
        </div>

        <!-- Button Text -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            {{ 'THEME.buttonText' | translate }}
          </label>
          <div class="flex items-center gap-4">
            <input
              type="color"
              [value]="customColors.buttonText"
              (change)="updateCustomColor('buttonText', $event)"
              class="w-12 h-12 rounded cursor-pointer"
            >
            <input
              type="text"
              [value]="customColors.buttonText"
              (input)="updateCustomColor('buttonText', $event)"
              class="px-3 py-2 border rounded-lg w-32"
            >
          </div>
        </div>
      </div>

      <!-- Typography Tab -->
      <div *ngSwitchCase="'typography'" class="space-y-6">
        <!-- Font Family -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            {{ 'THEME.fontFamily' | translate }}
          </label>
          <div class="grid grid-cols-3 gap-3">
            <button
              *ngFor="let font of fontFamilies"
              (click)="updateTypography('fontFamily', font.value)"
              [ngClass]="[
                font.value,
                'p-3 border rounded-lg',
                typographySettings.fontFamily === font.value
                  ? 'border-blue-500 bg-blue-50'
                  : 'border-gray-200'
              ]"
            >
              {{ font.label }}
            </button>
          </div>
        </div>

        <!-- Font Size -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            {{ 'THEME.fontSize' | translate }}
          </label>
          <div class="grid grid-cols-4 gap-3">
            <button
              *ngFor="let size of fontSizes"
              (click)="updateTypography('fontSize', size.value)"
              [ngClass]="[
                'p-3 border rounded-lg',
                typographySettings.fontSize === size.value
                  ? 'border-blue-500 bg-blue-50'
                  : 'border-gray-200'
              ]"
            >
              {{ size.label }}
            </button>
          </div>
        </div>

        <!-- Font Weight -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            {{ 'THEME.fontWeight' | translate }}
          </label>
          <div class="grid grid-cols-4 gap-3">
            <button
              *ngFor="let weight of fontWeights"
              (click)="updateTypography('fontWeight', weight.value)"
              [ngClass]="[
                weight.value,
                'p-3 border rounded-lg',
                typographySettings.fontWeight === weight.value
                  ? 'border-blue-500 bg-blue-50'
                  : 'border-gray-200'
              ]"
            >
              {{ weight.label }}
            </button>
          </div>
        </div>

        <!-- Preview -->
        <div class="mt-6 p-4 border rounded-lg">
          <h3 class="text-sm font-medium text-gray-700 mb-2">
            {{ 'THEME.preview' | translate }}
          </h3>
          <p [ngClass]="[
            typographySettings.fontFamily,
            typographySettings.fontSize,
            typographySettings.fontWeight
          ]" class="p-4 bg-gray-50 rounded">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit.
          </p>
        </div>
      </div>

      <!-- Sidebar Tab -->
      <div *ngSwitchCase="'sidebar'" class="space-y-6">
        <!-- Sidebar Background -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            {{ 'THEME.sidebarBackground' | translate }}
          </label>
          <div class="flex items-center gap-4">
            <input
              type="color"
              [value]="sidebarColors.background"
              (change)="updateSidebarColor('background', $event)"
              class="w-12 h-12 rounded cursor-pointer"
            >
            <input
              type="text"
              [value]="sidebarColors.background"
              (input)="updateSidebarColor('background', $event)"
              class="px-3 py-2 border rounded-lg w-32"
            >
          </div>
        </div>

        <!-- Logo Text Color -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            {{ 'THEME.sidebarLogoText' | translate }}
          </label>
          <div class="flex items-center gap-4">
            <input
              type="color"
              [value]="sidebarColors.logoText"
              (change)="updateSidebarColor('logoText', $event)"
              class="w-12 h-12 rounded cursor-pointer"
            >
          </div>
        </div>

        <!-- Item Text Color -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            {{ 'THEME.sidebarItemText' | translate }}
          </label>
          <div class="flex items-center gap-4">
            <input
              type="color"
              [value]="sidebarColors.itemText"
              (change)="updateSidebarColor('itemText', $event)"
              class="w-12 h-12 rounded cursor-pointer"
            >
            <input
              type="text"
              [value]="sidebarColors.itemText"
              (input)="updateSidebarColor('itemText', $event)"
              class="px-3 py-2 border rounded-lg w-32"
            >
          </div>
        </div>

        <!-- Active Item Text Color -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            {{ 'THEME.sidebarActiveItemText' | translate }}
          </label>
          <div class="flex items-center gap-4">
            <input
              type="color"
              [value]="sidebarColors.activeItemText"
              (change)="updateSidebarColor('activeItemText', $event)"
              class="w-12 h-12 rounded cursor-pointer"
            >
            <input
              type="text"
              [value]="sidebarColors.activeItemText"
              (input)="updateSidebarColor('activeItemText', $event)"
              class="px-3 py-2 border rounded-lg w-32"
            >
          </div>
        </div>

        <!-- Active Item Background -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            {{ 'THEME.sidebarActiveItemBg' | translate }}
          </label>
          <div class="flex items-center gap-4">
            <input
              type="color"
              [value]="sidebarColors.activeItemBg"
              (change)="updateSidebarColor('activeItemBg', $event)"
              class="w-12 h-12 rounded cursor-pointer"
            >
            <input
              type="text"
              [value]="sidebarColors.activeItemBg"
              (input)="updateSidebarColor('activeItemBg', $event)"
              class="px-3 py-2 border rounded-lg w-32"
            >
          </div>
        </div>

        <!-- Preview -->
        <div class="mt-6 p-4 border rounded-lg">
          <h3 class="text-sm font-medium text-gray-700 mb-2">
            {{ 'THEME.preview' | translate }}
          </h3>
          <div [ngStyle]="{'background-color': sidebarColors.background}" class="p-4 rounded-lg">
            <!-- Logo Preview -->
            <div [ngStyle]="{'color': sidebarColors.logoText}" class="font-bold mb-4">
              Vodacom BPM
            </div>

            <!-- Nav Items Preview -->
            <div class="space-y-2">
              <div class="flex items-center gap-2 px-3 py-2 rounded-lg"
                   [ngStyle]="{'color': sidebarColors.itemText}">
                <i class="fas fa-home"></i>
                <span>Menu Item</span>
              </div>
              <div class="flex items-center gap-2 px-3 py-2 rounded-lg"
                   [ngStyle]="{
                     'background-color': sidebarColors.activeItemBg,
                     'color': sidebarColors.activeItemText
                   }">
                <i class="fas fa-chart-bar"></i>
                <span>Active Item</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="flex justify-between mt-6 pt-6 border-t">
      <button
        (click)="removeThemeSelection()"
        class="px-4 py-2 border rounded-lg hover:bg-gray-100"
      >
        {{ 'Apply.cancel' | translate }}
      </button>
      <button
        (click)="applyChanges()"
        class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600"
      >
        {{ 'Apply.ok' | translate }}
      </button>
    </div>
  </div>
</div>
