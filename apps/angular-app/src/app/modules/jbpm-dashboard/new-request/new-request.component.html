<!-- overlay -->
<div class="modal-overlay" (click)="onClose()"></div>

<!-- card/dialog -->
<section class="modal-card" role="dialog" aria-modal="true">
  <header class="modal-header">
    <div class="header-left">
      <h2 class="title">{{ processName || 'Nouvelle demande' }}</h2>
      <div class="meta">
        <span class="chip" *ngIf="containerId">Conteneur: {{ containerId }}</span>
        <span class="chip" *ngIf="processId">Process: {{ processId }}</span>
        <span class="chip" *ngIf="taskId">Task #{{ taskId }}</span>
        <span class="chip" *ngIf="processInstanceId">Instance #{{ processInstanceId }}</span>
      </div>
    </div>
    <button class="icon-btn" (click)="onClose()" aria-label="Fermer">✕</button>
  </header>

  <div class="modal-body">
    <!-- Loading state -->
    <div *ngIf="loading" class="space-y-4">
      <div class="skeleton h-4" style="width: 160px"></div>
      <div class="skeleton" style="height: 140px"></div>
      <div class="skeleton" style="height: 12px; width: 70%"></div>
    </div>

    <!-- Error state -->
    <div *ngIf="error && !loading" class="status-bar">
      <span class="dot orange"></span>
      <span class="status-text">{{ error }}</span>
      <div style="margin-left:auto; display:flex; gap:8px;">
        <button class="btn ghost" (click)="retry()">Réessayer</button>
        <button class="btn ghost" (click)="startProcessWithoutAutoClaim()">Tester sans claim</button>
      </div>
    </div>

    <!-- Injected jBPM HTML -->
    <div *ngIf="showForm && !loading && !error" class="jbpm-form-scope" [innerHTML]="sanitizedFormHtml" (click)="handleFormClick($event)"></div>
  </div>

  <!-- Footer personnalisé supprimé pour n'afficher que les actions natives du formulaire jBPM -->
</section>
