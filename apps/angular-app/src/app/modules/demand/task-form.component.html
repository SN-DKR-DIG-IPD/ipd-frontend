<!-- Affichage des erreurs -->
<div *ngIf="errorMsg" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
  <strong>Erreur :</strong> {{ errorMsg }}
</div>

<!-- Suppression des messages de permissions côté front: le serveur renverra 401/403 si nécessaire -->

<!-- Loading -->
<div *ngIf="isLoading" class="flex justify-center items-center py-8">
  <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600"></div>
  <span class="ml-3 text-gray-600">Chargement du formulaire...</span>
</div>

<!-- Formulaire HTML chargé directement -->
<div *ngIf="sanitizedFormHtml && !isLoading" class="task-form-container">
  <div class="form-header">
    <h3>Formulaire de demande</h3>
    <div class="pill-group">
      <span class="pill" (click)="taskService.claimTask(taskId, containerId)">Claim</span>
      <span class="pill" (click)="taskService.releaseTask(taskId, containerId)">Release</span>
      <span class="pill" (click)="taskService.startTask(taskId, containerId)">Start</span>
      <span class="pill" (click)="taskService.stopTask(taskId, containerId)">Stop</span>
      <span class="pill" (click)="saveCurrentForm()">Save</span>
      <span class="pill primary" (click)="submitHtmlForm()">Complete</span>
    </div>
  </div>

  <div [innerHTML]="sanitizedFormHtml" class="jbpm-form-content" (click)="handleFormClick($event)"></div>

  <!-- Boutons d'action en bas -->
  <div class="footer-actions">
    <button type="button" class="btn ghost" (click)="cancel()">Annuler</button>
    <button type="button" class="btn primary" [disabled]="isLoading" (click)="submitHtmlForm()">
      {{ isLoading ? 'Soumission...' : 'Soumettre' }}
    </button>
    <button type="button" class="btn" (click)="submitAndGoNext()">Soumettre et suivant</button>
  </div>
</div>

<!-- Formulaire dynamique (fallback) -->
<div *ngIf="!sanitizedFormHtml && !isLoading && !errorMsg" class="dynamic-form-container">
    <form *ngIf="formGroup" [formGroup]="formGroup" (ngSubmit)="onSubmit()" class="space-y-4">
      <div *ngFor="let field of fields" class="space-y-2">
        <label [for]="field.key" class="block text-sm font-medium text-gray-700">{{ field.key }}</label>
        <ng-container [ngSwitch]="field.type">
          <input *ngSwitchCase="'number'" type="number" [id]="field.key" [formControlName]="field.key" 
                 class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <input *ngSwitchCase="'boolean'" type="checkbox" [id]="field.key" [formControlName]="field.key" 
                 class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" />
          <textarea *ngSwitchCase="'string'" [id]="field.key" [formControlName]="field.key" 
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                    rows="3"></textarea>
          <input *ngSwitchDefault type="text" [id]="field.key" [formControlName]="field.key" 
                 class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </ng-container>
      </div>
    
    <div class="flex justify-end space-x-4 pt-4">
      <button type="button" (click)="cancel()" 
              class="px-4 py-2 text-gray-700 bg-gray-200 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500">
        Annuler
      </button>
      <button type="submit" [disabled]="isLoading || formGroup.invalid" 
              class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-50">
        {{ isLoading ? 'Soumission...' : 'Soumettre' }}
      </button>
    </div>
    </form>
    
    <div *ngIf="!formGroup && !errorMsg" class="text-center py-8">
      <div class="bg-yellow-50 border border-yellow-200 rounded-md p-4">
        <p class="text-yellow-800">
          Aucun champ à afficher pour cette tâche. Vérifiez la configuration du process côté jBPM.
        </p>
      </div>
    </div>
  </div>
