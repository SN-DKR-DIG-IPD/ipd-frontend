<div class="flex-none m-2 px-6 pt-6 pb-12 bg-lightBlue rounded-lg">
  <app-timeline [(currentStep)]="currentStep" [(maxLevel)]="maxLevel"></app-timeline>
</div>
<h1>natio</h1>

<button (click)="onStartProcess()" [disabled]="isLoading">Start</button>
<div *ngIf="isLoading">Chargement...</div>
<div *ngIf="errorMsg" class="alert alert-danger">{{ errorMsg }}</div>
<app-task-form *ngIf="showTaskForm && taskId" [containerId]="containerId" [taskId]="taskId"></app-task-form>
