<div class="sidebar-split-container">
  <!-- Colonne verticale bleue extensible -->
  <div class="sidebar-split-blue" [ngClass]="{'expanded': !isReduced}">
    <div class="sidebar-split-burger" (click)="toggleSidebar()">
      <lucide-icon name="menu" class="sidebar-split-icon"></lucide-icon>
      <span *ngIf="!isReduced" class="sidebar-split-label">Menu</span>
    </div>
    <div class="sidebar-split-icons">
      <div class="sidebar-split-icon-group">
        <lucide-icon name="settings" class="sidebar-split-icon"></lucide-icon>
        <span *ngIf="!isReduced" class="sidebar-split-label">Configurations</span>
      </div>
      <div class="sidebar-split-icon-group sidebar-split-notif">
        <lucide-icon name="bell" class="sidebar-split-icon"></lucide-icon>
        <span class="sidebar-split-badge">3</span>
        <span *ngIf="!isReduced" class="sidebar-split-label">Notifications</span>
      </div>
    </div>
    <div class="sidebar-split-avatar">
      <!-- Avatar ou bloc vide d'origine, rollback -->
    </div>
    <div class="sidebar-profile-bottom mt-auto w-full">
      <app-user-profile-sidebar
        [username]="(username$ | async) ?? ''"
        [roles]="(roles$ | async) ?? []"
        [groups]="(groups$ | async) ?? []">
      </app-user-profile-sidebar>
    </div>
  </div>
  <!-- Bloc menu principal blanc -->
  <div class="sidebar-split-main">
    <div class="sidebar-split-header">
      <img src="assets/images/logo.png" alt="logo Institut Pasteur de Dakar" class="sidebar-split-logo" />
      <span class="sidebar-split-menu-title">MENU</span>
    </div>
    <div class="sidebar-split-menu">
      <ul class="sidebar-split-menu-list">
        <li *ngFor="let item of menuItems; let i = index"
            class="sidebar-split-menu-item"
            [routerLink]="!item.subMenu ? item.route : null"
            [ngClass]="{
              'active': selectedMenu === i && !selectedSubMenu && !item.subMenu,
              'open': selectedMenuIndex === i && item.subMenu
            }"
            (click)="!item.subMenu ? goTo(i) : null">
          <div class="sidebar-split-menu-link" (click)="item.subMenu ? toggleSubMenu(i) : null">
            <lucide-icon
              [name]="item.icon"
              class="sidebar-split-menu-icon"
              [ngClass]="{'active-icon': selectedMenu === i && !item.subMenu}"
            ></lucide-icon>
            <span class="sidebar-split-menu-label">{{ item.label }}</span>
            <button *ngIf="item.subMenu" class="sidebar-split-plus-btn" (click)="$event.stopPropagation(); toggleSubMenu(i)">
              <span [ngClass]="{'rotated': selectedMenuIndex === i}">+</span>
            </button>
          </div>
          <ul *ngIf="selectedMenuIndex === i && item.subMenu" class="sidebar-split-submenu-list">
            <li *ngFor="let sub of item.subMenu"
                class="sidebar-split-submenu-item"
                [routerLink]="sub.route"
                (click)="selectSubMenu(sub.route)"
                [ngClass]="{
                  'active': selectedSubMenu === sub.route
                }">
              <span class="sidebar-split-submenu-label">{{ sub.label }}</span>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</div>
