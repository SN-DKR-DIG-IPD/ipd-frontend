<div class="flex flex-row mx-5 items-center">
  <div>
    <app-breadcrumb></app-breadcrumb>
    <h1 class="font-bold text-2xl">Titre</h1>
  </div>
  <div class="ml-auto relative">
<!--    <lucide-icon name="printer" class="h-10"></lucide-icon>-->
    <button
      (click)="toggleMenu()"
      class="bg-primary text-white p-3 rounded-lg flex items-center space-x-2"
    >
      Nouvelle demande OM
      <lucide-icon name="plus" class="ml-1 h-5"></lucide-icon>
    </button>

    <div
      *ngIf="isMenuVisible"
      class="absolute left-0 mt-3 p-3 font-bold text-black bg-white shadow-lg rounded-lg"
    >
      <ul>
        <li class="flex items-center gap-2 px-4 py-2 cursor-pointer whitespace-nowrap">
          <lucide-icon name="globe-lock"></lucide-icon>OM nationale
        </li>
        <li class="flex items-center gap-2 px-4 py-2 cursor-pointer whitespace-nowrap">
          <lucide-icon name="globe"></lucide-icon>OM internationale
        </li>
      </ul>
    </div>
  </div>
</div>
