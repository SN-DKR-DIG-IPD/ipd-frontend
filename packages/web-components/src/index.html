<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Stencil Component Starter</title>

    <script type="module" src="/build/web-components.esm.js"></script>
    <script nomodule src="/build/web-components.js"></script>

      user-label = "Login"
      user-placeholder= "Saisissez votre loginn"
      password-label = "Mot de passe"
      password-placeholder = "Saisissez votre mot de passee"
      submit-btn-text = "Se connecter"
      forget-passwrd-text = "Mot de passe oublié ?"

    </jbpm-app-sidebar>
